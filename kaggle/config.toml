# All settings for the Kaggle pipeline. Nothing secret goes here: API keys and tokens live only in
# Kaggle Secrets (GITHUB_TOKEN, HF_TOKEN, LLM_API_KEY, ANTHROPIC_API_KEY, ...).
# Change a setting here, push to GitHub, and re-run the notebook: it pulls the new version first.

[pipeline]
# Stages run in this order when the notebook calls run_pipeline.py with no --stages.
# Every stage skips itself if its work is already done, so re-running is always safe.
#
# GPU session (Accelerator: GPU T4 x2):  STAGES = ""  -> train + test the local models only, no outside API calls
# CPU session (Accelerator: None), after the GPU run:  STAGES = "setup,data,api,evaluate"
#   -> the API models answer the same questions; results come and go through the Hub repo, no GPU used.
# Other stages you can name explicitly: dryrun, speedtest, llm_smoketest
stages = ["setup", "data", "train", "merge", "infer", "evaluate"]
session_hours = 11.5                # Kaggle kills a session at 12 h; everything is planned to finish before this
reserve_after_train_minutes = 75    # training stops early enough to leave this for merge, inference and the report

[model]
base = "Qwen/Qwen3-4B-Instruct-2507"

[train]
out = "outputs/qwen3-4b-tatqa"
epochs = 2
lr = 2e-4
short_prompt = true     # fine-tuned model gets a one-line instruction (~300 fewer tokens per example);
                        # prompted models (base SLM, API LLMs) always get the full instructions + examples
quantize_4bit = false   # speedtest on 2x T4: 16-bit LoRA 1.16 ex/s (9.1 GB peak) vs QLoRA 1.03 ex/s (5.5 GB)
gradient_checkpointing = true   # must stay on: without it a 4B model runs out of memory on a T4, even at batch 1
batch_size = 2          # per GPU; keep batch_size x grad_accum x 2 GPUs = 32
grad_accum = 8
max_len = 2048
save_steps = 50         # checkpoint every ~20 min of training (each is uploaded to the Hub repo below)
eval_steps = 100        # validation loss every ~45 min
max_hours = 10.5        # stop cleanly before Kaggle's 12 h session limit; re-run to continue
hub_repo = "auto"       # private Hugging Face repo that keeps checkpoints AND results across sessions.
                        # "auto" = <your HF username>/<hub_name>, read from the HF_TOKEN secret (needs a WRITE token)
hub_name = "qwen3-4b-tatqa"
require_hub_backup = true   # refuse to start training without a working backup (a lost session = lost training)

[dryrun]
samples = 64
val_samples = 16

# "speedtest" stage: a short run of each setup below on both GPUs, then a table of speed and memory.
# Run it with STAGES = "setup,data,speedtest". Each setup keeps the effective batch at 32 and uses
# [train] short_prompt. Setups already measured with identical settings in the session are reused.
[[speedtest]]
name = "qlora_bs2"
quantize_4bit = true
batch_size = 2
grad_accum = 8
gradient_checkpointing = true

[[speedtest]]
name = "lora16_bs2"
quantize_4bit = false
batch_size = 2
grad_accum = 8
gradient_checkpointing = true

[[speedtest]]
name = "qlora_bs1_nockpt"
quantize_4bit = true
batch_size = 1
grad_accum = 16
gradient_checkpointing = false

[[speedtest]]
name = "lora16_bs1_nockpt"
quantize_4bit = false
batch_size = 1
grad_accum = 16
gradient_checkpointing = false

[infer]
backend = "hf"          # plain Hugging Face generate. NOT "vllm" on Kaggle: installing vLLM replaces PyTorch with a
                        # build that breaks transformers there (torch/torchaudio CUDA mismatch) - every model load fails
gpu_hourly_usd = 0.35   # cloud price of one T4, used for the cost comparison
batch_finetuned = 32    # most questions per batch for the fine-tuned model (short answers)
batch_fewshot = 8       # for the base model with worked examples + reasoning (long prompts and answers)
# A batch is also capped at questions x (longest prompt + answer room) tokens, so the longest questions
# (2,000+ tokens) run in small batches: on a T4 the attention memory grows with batch x length^2.
token_budget_finetuned = 16000
token_budget_fewshot = 16000
latency_n = 50          # single requests timed one by one for the latency column

# ---------------------------------------------------------------- API contestants
# Every enabled entry answers the same fixed questions (limit) in the CPU-only run
# (STAGES = "setup,data,api,evaluate"); all run at the same time. An entry whose key secret is not
# attached is skipped. Prices: USD per 1M tokens at LIST price (what a business would pay, not free
# credits) - confirm each on the provider's pricing page; without prices the report shows cost as unknown.
# max_tokens caps thinking + final answer together, so it is generous and the same for every model:
# a reasoning model that runs out mid-thought returns no answer (shown as 'Cut off %' in the report).
# Active comparison: MiniMax-M2.7 only (the provider's main model line, known list price).
# The others are kept switched off; set enabled = true to add one.

[[api]]
name = "glm_5_3_flash"                       # name in the report
provider = "openai_compatible"
base_url = "https://inference.dahl.global/v1"
model = "zai-org/GLM-5.3-Flash"
key_secret = "LLM_API_KEY"
limit = 500
price_in = 0.15                              # widely reported Z.ai list price, Oct 2026
price_out = 0.50
extra = "--concurrency 1 --max_tokens 32768 --request_timeout 900"
enabled = false

[[api]]
name = "deepseek_v4_flash"
provider = "openai_compatible"
base_url = "https://inference.dahl.global/v1"
model = "deepseek-ai/DeepSeek-V4-Flash-0731"  # check the exact id in your provider's model list
key_secret = "LLM_API_KEY"
limit = 500
# price_in = ...                             # confirm on DeepSeek's or your provider's pricing page
# price_out = ...
extra = "--concurrency 1 --max_tokens 32768 --request_timeout 900"
enabled = false

[[api]]
name = "minimax_m2_7"
provider = "openai_compatible"
base_url = "https://inference.dahl.global/v1"
model = "MiniMaxAI/MiniMax-M2.7"
key_secret = "LLM_API_KEY"
limit = 1663                                 # the full official test set; answers already saved are skipped
price_in = 0.30                              # most commonly listed MiniMax list price, Oct 2026
price_out = 1.20
extra = "--concurrency 4 --max_tokens 32768 --request_timeout 900"   # ~20 s to many min per answer
enabled = true

[[api]]
name = "claude_opus_5_5"
provider = "anthropic"
model = "claude-opus-5-5"
key_secret = "ANTHROPIC_API_KEY"
limit = 500
extra = ""                                   # list price is built into src/infer_api.py
enabled = false
